services:
  nowhere:
    build: .
    ports: ["8000:8000"]
    environment:
      # default is the rule-based mock (no key, no cost). For a real model set these, e.g. Gemini free tier:
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes: ["nowhere-data:/data"]
volumes:
  nowhere-data:
