<div class="notes"><p><b>깨우는 법</b> 출근 도장 시스템이 HMAC으로 서명한 웹훅을 보내요. 서명이 틀리면 비서는 움직이지 않아요.</p><p><b>믿지 않는 입력</b> 메일·채팅 본문은 지시가 아니라 데이터로만 모델에 줘요. 근거 id가 없는 할 일은 버려요.</p><p><b>사람이 마지막</b> 초안은 제안일 뿐이고, 외부 수신자는 한 번 더 확인해야 보내져요.</p></div>
