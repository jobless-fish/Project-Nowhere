<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 업무 비서</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#ddd;--ac:#2563eb;--hi:#b91c1c;--ok:#15803d;--warn:#b45309;--chip:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--bd:#333;--ac:#60a5fa;--hi:#f87171;--ok:#4ade80;--warn:#fbbf24;--chip:#1e293b}}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:auto;padding:16px;max-width:760px}
h1{font-size:20px;margin:0 0 12px}select,button{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
button.p{background:var(--ac);color:#fff;border:0;cursor:pointer}button{cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs button{border-radius:6px 6px 0 0}.tabs button.on{border-bottom:2px solid var(--ac);font-weight:600}
.c{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0}.hi{border-left:4px solid var(--hi)}.nm{border-left:4px solid var(--ac)}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}.pill.hi{background:var(--hi);color:#fff;border:0}
.m{color:var(--mut);font-size:13px}.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0}
.w{border-color:var(--warn);color:var(--warn)}.done{opacity:.5;text-decoration:line-through}
</style></head><body>
<h1>AI 업무 비서</h1>
<div class="bar"><select id="u"></select><button class="p" onclick="clockIn()">출근 도장 찍기</button><span class="m" id="at"></span></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">오늘의 브리핑</button><button id="t2" onclick="tab(2)">사내 소식 요약</button></div>
<div id="v1"><p class="m">출근 도장을 찍으면 브리핑이 만들어집니다.</p></div><div id="v2" hidden></div>
<script>
const key=new URLSearchParams(location.search).get('key');
const H=()=>({'Content-Type':'application/json',...(key?{'X-API-Key':key}:{})});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch(p,{headers:H(),...o});if(!r.ok)throw new Error(await r.text());return r.json()}
const $=id=>document.getElementById(id);let B=null,FB={};
const chips=(ids,src)=>ids.map(i=>`<span class="chip" title="${esc(src[i]?.sender)}">${esc(src[i]?.source)} · ${esc(src[i]?.title)}</span>`).join('');
function tab(n){$('v1').hidden=n!==1;$('v2').hidden=n!==2;$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':'';if(n===2)news()}
async function init(){const us=await api('/assistant/users');$('u').innerHTML=us.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role==='executive'?'임원':'사원'})</option>`).join('')}
async function clockIn(){const r=await api('/assistant/clock-in',{method:'POST',body:JSON.stringify({user_id:$('u').value})});
 $('at').textContent='출근 '+r.clock_in_at.slice(11,16)+(r.cached?' (오늘 이미 생성된 브리핑)':'');B=r.briefing;FB=await api('/assistant/feedback?user_id='+$('u').value);draw()}
function draw(){const b=B,s=b.sources;
 $('v1').innerHTML=`<div class="c"><b>${esc(b.summary)}</b>${b.degraded?'<div class="m w">AI 연결 문제로 규칙 기반 요약입니다.</div>':''}</div>
 <h3>오늘의 할일 (${b.todos.length})</h3>`+(b.todos.map(t=>`<div class="c ${t.priority==='high'?'hi':'nm'} ${FB[t.key]==='done'?'done':''}">
  ${t.priority==='high'?'<span class="pill hi">긴급</span> ':''}<b>${esc(t.title)}</b> ${t.due?`<span class="m">· 기한 ${esc(t.due)}</span>`:''}
  <div class="m">${esc(t.reason)}</div><div>${chips(t.source_ids,s)}</div>
  <div style="margin-top:6px"><button onclick="fb('${t.key}','done')">완료</button> <button onclick="fb('${t.key}','wrong')">관련 없음</button></div></div>`).join('')||'<p class="m">할일이 없습니다.</p>')
 +(b.fyi.length?`<h3>참고</h3>`+b.fyi.map(f=>`<div class="c"><span>${esc(f.title)}</span> <span class="m">${chips(f.source_ids,s)}</span></div>`).join(''):'')
 +(b.flagged.length?`<h3>보안 확인 필요</h3>`+b.flagged.map(f=>`<div class="c w">${esc(f.title)}<div class="m">${esc(f.reason)}</div></div>`).join(''):'')}
async function fb(k,v){await api('/assistant/feedback',{method:'POST',body:JSON.stringify({user_id:$('u').value,todo_key:k,value:v})});FB[k]=v;draw()}
async function news(){const n=await api('/assistant/news?user_id='+$('u').value);
 $('v2').innerHTML=n.highlights.map(h=>`<div class="c"><b>${esc(h.title)}</b> <span class="chip">${esc(h.category)}</span><div>${esc(h.summary)}</div><div>${chips(h.source_ids,n.sources)}</div></div>`).join('')||'<p class="m">새 소식이 없습니다.</p>'}
$('u').onchange=()=>{B=null;$('at').textContent='';$('v1').innerHTML='<p class="m">출근 도장을 찍으면 브리핑이 만들어집니다.</p>'};
init();
</script></body></html>
