# Render blueprint: a public demo of the real backend (not a mock). UNTESTED here: no Render account or Docker in the build sandbox.
# Demo caveats: open login by design (the company is fictional), data resets on redeploy, rule-based LLM unless you set a key.
services:
  - type: web
    name: project-nowhere
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: LLM_PROVIDER, value: mock }
      - { key: DEFAULT_MODE, value: auto }
      - { key: DOCFLOW_DB, value: /tmp/nowhere.db }
